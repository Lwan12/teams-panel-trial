<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>任务面板（试用）</title>
<script src="https://res.cdn.office.net/teams-js/2.58.0/js/MicrosoftTeams.min.js"
        integrity="sha384-sMo/EOqQPa1OCup2/VBRum7oFeOS22kvs8WGDc45xK53tUVZzFR5WwFYDUYN1LO4"
        crossorigin="anonymous"></script>
<style>
  :root { --brand:#5b5fc7; --bg:#f5f5f7; --card:#fff; --text:#242424; --muted:#616161; --line:#e0e0e0; }
  body.theme-dark { --bg:#1f1f1f; --card:#292929; --text:#f0f0f0; --muted:#adadad; --line:#3d3d3d; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); }
  header { padding:20px 24px 8px; }
  h1 { margin:0; font-size:20px; font-weight:600; }
  .sub { margin-top:4px; font-size:12px; color:var(--muted); }
  nav { display:flex; gap:8px; padding:12px 24px; }
  nav button { border:1px solid var(--line); background:var(--card); color:var(--text); padding:8px 18px; border-radius:6px; font-size:14px; cursor:pointer; }
  nav button.active { background:var(--brand); border-color:var(--brand); color:#fff; }
  main { padding:0 24px 24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:20px; }
  .card h2 { margin:0 0 12px; font-size:16px; }
  .ph { color:var(--muted); font-size:14px; line-height:1.7; }
  .field { height:34px; border:1px dashed var(--line); border-radius:4px; margin:8px 0; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:500; }
  footer { padding:0 24px 16px; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>任务面板（试用）</h1>
  <div class="sub">纯前端演示页 · 不连接任何后端 · 所有内容为占位</div>
</header>
<nav>
  <button id="btn-new" class="active" type="button">发任务</button>
  <button id="btn-list" type="button">任务列表</button>
</nav>
<main>
  <section id="view-new" class="card">
    <h2>发任务</h2>
    <div class="ph">这里将来放「发任务」表单（占位）。</div>
    <div class="field"></div><div class="field"></div><div class="field" style="height:80px"></div>
  </section>
  <section id="view-list" class="card" hidden>
    <h2>任务列表</h2>
    <div class="ph">这里将来显示任务列表（占位，以下为示例行）。</div>
    <table>
      <thead><tr><th>编号</th><th>标题</th><th>状态</th></tr></thead>
      <tbody>
        <tr><td>示例-1</td><td>占位任务 A</td><td>待处理</td></tr>
        <tr><td>示例-2</td><td>占位任务 B</td><td>进行中</td></tr>
      </tbody>
    </table>
  </section>
</main>
<footer id="host">运行环境：检测中…</footer>
<script>
  (function () {
    var views = { new: document.getElementById('view-new'), list: document.getElementById('view-list') };
    var btns = { new: document.getElementById('btn-new'), list: document.getElementById('btn-list') };
    function show(k) {
      Object.keys(views).forEach(function (x) { views[x].hidden = (x !== k); btns[x].classList.toggle('active', x === k); });
    }
    btns.new.addEventListener('click', function () { show('new'); });
    btns.list.addEventListener('click', function () { show('list'); });

    var host = document.getElementById('host');
    if (window.microsoftTeams && microsoftTeams.app) {
      microsoftTeams.app.initialize().then(function () {
        return microsoftTeams.app.getContext();
      }).then(function (ctx) {
        var theme = ctx && ctx.app && ctx.app.theme;
        if (theme === 'dark' || theme === 'contrast') document.body.classList.add('theme-dark');
        host.textContent = '运行环境：已嵌入 ' + ((ctx && ctx.app && ctx.app.host && ctx.app.host.name) || 'Teams');
        microsoftTeams.app.registerOnThemeChangeHandler(function (t) {
          document.body.classList.toggle('theme-dark', t === 'dark' || t === 'contrast');
        });
        microsoftTeams.app.notifySuccess();
      }).catch(function () { host.textContent = '运行环境：普通浏览器（未在 Teams 中）'; });
    } else {
      host.textContent = '运行环境：普通浏览器（Teams SDK 未加载）';
    }
  })();
</script>
</body>
</html>
