<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Teams 任务面板 · 静态原型（A/B）</title>
<style>
:root{
  --g0:#FFFFFF;--g1:#FAFAFA;--g2:#F5F5F5;--g3:#F0F0F0;--g4:#E6E6E6;--g5:#D1D1D1;--g6:#A0A0A0;--g7:#616161;--g8:#424242;--g9:#242424;
  --p0:#EBF3FC;--p1:#CFE4FA;--p2:#B4D6FA;--p5:#0F6CBD;--p6:#115EA3;--p7:#0F548C;
  --ok0:#F1FAF1;--ok1:#9FD89F;--ok3:#0E700E;
  --wa0:#FFF8EB;--wa1:#F7D79B;--wa2:#BC6F00;--wa3:#8A5300;
  --er0:#FDF3F4;--er1:#EEACB2;--er2:#C50F1F;--er3:#A4262C;
  --teams:#5B5FC7;
  --mono:Consolas,"Cascadia Mono","DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:14px;line-height:1.55;color:var(--g9);background:var(--g3);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--g9)}
.mono{font-family:var(--mono)}
/* prototype bar */
.pbar{height:32px;flex:none;background:#2B2B2B;color:#D6D6D6;display:flex;align-items:center;gap:6px;padding:0 12px;font-size:12px}
.pbar b{color:#fff;font-weight:600;margin-right:8px}
.pbar .seg{display:flex;border:1px solid #555;border-radius:4px;overflow:hidden}
.pbar .seg button{background:transparent;border:0;color:#D6D6D6;padding:2px 10px;font-size:12px}
.pbar .seg button.on{background:#E6E6E6;color:#242424;font-weight:600}
.pbar .sp{flex:1}
/* teams shell */
.tbar{height:44px;flex:none;background:#EBEBEB;display:flex;align-items:center;padding:0 12px;gap:12px}
.tbar .nav{color:var(--g7);font-size:16px;width:64px}
.tbar .search{flex:0 1 520px;margin:0 auto;height:30px;background:#fff;border-radius:4px;display:flex;align-items:center;padding:0 10px;color:var(--g6);font-size:13px}
.tbar .me{width:30px;height:30px;border-radius:50%;background:#C7D7EC;color:#0C3B5E;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
.shell{flex:1;display:flex;min-height:0}
.rail{width:64px;flex:none;background:#EBEBEB;display:flex;flex-direction:column;align-items:center;padding-top:4px}
.rail .it{width:64px;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--g7);position:relative;gap:2px}
.rail .it svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5}
.rail .it.on{color:var(--teams);font-weight:600}
.rail .it.on::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 2px 2px 0;background:var(--teams)}
.stage{flex:1;display:flex;min-width:0;background:#fff;border-top-left-radius:8px;overflow:hidden}
/* teams chat list (tab entry) */
.clist{width:280px;flex:none;background:var(--g1);display:flex;flex-direction:column}
.clist h2{font-size:16px;font-weight:600;margin:0;padding:14px 16px 10px}
.clist .c{display:flex;gap:10px;padding:8px 16px;align-items:center}
.clist .c.on{background:#fff}
.clist .c .av{width:32px;height:32px;border-radius:50%;background:var(--g4);color:var(--g8);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
.clist .c .n{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clist .c .s{font-size:12px;color:var(--g7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clist .c>div{min-width:0}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.chead{height:48px;flex:none;display:flex;align-items:flex-end;gap:20px;padding:0 20px;background:#fff;border-bottom:1px solid var(--g4)}
.chead .gname{font-size:16px;font-weight:600;align-self:center;margin-right:8px}
.chead .tab{padding:0 2px 11px;font-size:14px;color:var(--g7);position:relative}
.chead .tab.on{color:var(--g9);font-weight:600}
.chead .tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;border-radius:2px;background:var(--teams)}
.ahead{height:48px;flex:none;display:flex;align-items:flex-end;gap:20px;padding:0 20px;background:#fff;border-bottom:1px solid var(--g4)}
.ahead .appname{font-size:16px;font-weight:600;align-self:center;display:flex;align-items:center;gap:8px;margin-right:8px}
.ahead .appname i{width:24px;height:24px;border-radius:4px;background:var(--p5);color:#fff;font-style:normal;font-size:12px;display:flex;align-items:center;justify-content:center}
.body{flex:1;display:flex;min-height:0}
/* list pane */
.list{width:340px;flex:none;background:var(--g1);display:flex;flex-direction:column;min-height:0}
.list.narrow{width:300px}
.list.right{width:300px;border-left:1px solid var(--g4)}
.list.right.narrow{width:280px}
.ltop{padding:12px 12px 8px;display:flex;flex-direction:column;gap:8px}
.ltop .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.newbtn{display:flex;align-items:center;gap:6px;justify-content:center;height:32px;border:1px solid var(--g5);background:#fff;border-radius:4px;font-weight:600;color:var(--g9);width:100%}
.newbtn:hover{border-color:var(--g6)}
.inp{height:30px;border:1px solid var(--g4);border-bottom-color:var(--g6);border-radius:4px;background:#fff;padding:0 8px;font-size:13px;width:100%}
.sel{height:28px;border:1px solid var(--g4);border-radius:4px;background:#fff;padding:0 4px;font-size:12px;min-width:0;flex:1}
.segm{display:flex;background:var(--g3);border-radius:4px;padding:2px;flex:none}
.segm button{border:0;background:transparent;font-size:12px;padding:2px 10px;border-radius:3px;color:var(--g7)}
.segm button.on{background:#fff;color:var(--g9);font-weight:600;box-shadow:0 0 0 1px var(--g4)}
.chip-t{border:1px solid var(--g4);background:#fff;border-radius:4px;font-size:12px;padding:3px 8px;color:var(--g8);flex:none;white-space:nowrap}
.chip-t.on{background:var(--wa0);border-color:var(--wa1);color:var(--wa3);font-weight:600}
.lcount{font-size:12px;color:var(--g7);padding:0 12px 6px;display:flex;justify-content:space-between}
.lcount button{border:0;background:none;color:var(--p5);font-size:12px;padding:0}
.items{flex:1;overflow:auto;padding:0 8px 12px}
.item{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:4px;padding:8px 10px 9px 12px;margin-bottom:2px;position:relative}
.item:hover{background:var(--g3)}
.item.on{background:var(--p0)}
.item.on::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--p5)}
.item .l1{display:flex;align-items:baseline;gap:6px;font-size:12px;color:var(--g7)}
.item .l1 .id{font-size:13px;font-weight:600;color:var(--g9)}
.item .l1 .t{margin-left:auto;flex:none}
.item .l1 .gn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.item .l2{font-size:13px;line-height:1.45;margin:2px 0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .l3{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--g7);min-width:0}
.item .l3 .st{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.empty{padding:32px 16px;text-align:center;color:var(--g7);font-size:13px}
.empty b{display:block;color:var(--g9);font-size:14px;margin-bottom:4px}
.empty button{margin-top:8px}
/* badges */
.bd{display:inline-flex;align-items:center;gap:3px;font-size:12px;line-height:18px;padding:0 6px;border-radius:4px;font-weight:600;white-space:nowrap;flex:none}
.bd.New,.bd.Non,.bd.Cancelled{background:var(--g3);color:var(--g8)}
.bd.InProgress{background:var(--p0);color:var(--p7)}
.bd.Done{background:var(--ok0);color:var(--ok3)}
.bd.Failed{background:var(--er0);color:var(--er3)}
.bd.wait{background:var(--wa0);color:var(--wa3)}
.bd.c-pass{background:var(--ok0);color:var(--ok3)}
.bd.c-diff{background:var(--wa0);color:var(--wa3)}
.bd.c-none{background:var(--g3);color:var(--g8)}
.bd.c-first{background:#EEF1F5;color:#3B4A5C}
/* detail */
.detail{flex:1;display:flex;flex-direction:column;min-width:0;background:#fff}
.dhead{padding:14px 24px 12px;flex:none}
.dhead .back{border:0;background:none;color:var(--p5);padding:0;font-size:13px;margin-bottom:6px}
.dhead .r1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.dhead h1{white-space:nowrap}
.dhead h1{font-size:20px;line-height:1.2;margin:0;font-weight:600}
.dhead .acts{margin-left:auto;display:flex;gap:4px}
.dhead .meta{font-size:12px;color:var(--g7);margin-top:4px}
.dhead .meta b{color:var(--g8);font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13px;margin-top:10px;background:var(--g2);border-radius:4px;padding:8px 12px}
.kv dt{color:var(--g8);font-weight:600;white-space:nowrap}
.kv dd{margin:0;color:var(--g9)}
.tbtn{border:0;background:none;color:var(--g8);font-size:13px;padding:4px 8px;border-radius:4px}
.tbtn:hover{background:var(--g3)}
.btn{height:32px;padding:0 14px;border-radius:4px;border:1px solid var(--g5);background:#fff;font-weight:600;font-size:13px;color:var(--g9)}
.btn.pri{background:var(--p5);border-color:var(--p5);color:#fff}
.btn.pri:hover{background:var(--p6)}
.btn:disabled,.btn.pri:disabled,.btn.pri:disabled:hover{background:var(--g3);border-color:var(--g4);color:var(--g6);cursor:not-allowed}
.btn.danger{background:var(--er2);border-color:var(--er2);color:#fff}
.tl{flex:1;overflow:auto;padding:4px 24px 16px}
.msg{display:flex;gap:10px;padding:8px 0;max-width:700px}
.av{width:32px;height:32px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:#C7D7EC;color:#0C3B5E}
.av.bot{border-radius:4px;background:var(--g8);color:#fff}
.av.c1{background:#E3D9C6;color:#5C4320}.av.c2{background:#D5E5D5;color:#2E4B2E}.av.c3{background:#E6D3DA;color:#5E2E40}
.mb{min-width:0;flex:1}
.mh{display:flex;align-items:baseline;gap:8px;font-size:12px;color:var(--g7)}
.mh b{font-size:13px;color:var(--g9);font-weight:600}
.mh .k{color:var(--g7)}
.mt{font-size:14px;max-width:640px;margin-top:1px;word-break:break-word}
.sysl{font-size:12px;color:var(--g7);padding:4px 0 4px 42px;display:flex;gap:8px;align-items:baseline}
.sysl.hl{color:var(--p7);font-weight:600}
.sysl .t{color:var(--g6);font-weight:400}
.card{margin-top:6px;border-radius:6px;background:var(--g2);padding:12px 14px;max-width:600px;position:relative}
.card.q{border-left:3px solid var(--wa2)}
.card.q.done{border-left-color:var(--ok1)}
.card.res{border-left:3px solid var(--g5);background:var(--g2)}
.card.fail{border-left:3px solid var(--er1)}
.card .ch{flex-wrap:wrap;display:flex;align-items:baseline;gap:8px;font-size:13px;font-weight:600;margin-bottom:8px}
.card .ch .sub{font-weight:400;color:var(--g7);font-size:12px}
.qi{margin-bottom:10px}
.qi .qt{font-size:13px;font-weight:600;margin-bottom:4px}
.opt{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid var(--g4);background:#fff;border-radius:4px;padding:5px 10px;margin-bottom:4px;font-size:13px;color:var(--g9)}
.opt .dot{width:14px;height:14px;border-radius:50%;border:1px solid var(--g6);flex:none;display:flex;align-items:center;justify-content:center}
.opt .ltr{font-weight:600;color:var(--g8);width:14px}
.opt.on{border-color:var(--p5);background:var(--p0)}
.opt.on .dot{border-color:var(--p5)}
.opt.on .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--p5)}
.opt:disabled{cursor:default}
.opt.on:disabled{background:#fff;border-color:var(--g4)}
.qf{display:flex;align-items:center;gap:12px;margin-top:4px;font-size:12px;color:var(--g7)}
.rk{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;margin:8px 0}
.rk dt{color:var(--g8);font-weight:600;white-space:nowrap}
.rk dd.mono{word-break:break-all}
.rk dd{margin:0}
.warn{background:var(--wa0);color:var(--wa3);font-size:12px;padding:6px 10px;border-radius:4px;margin-top:8px}
.warn b{font-weight:600}
.fold{text-align:left;border:0;background:none;color:var(--g8);font-size:12px;padding:4px 0 4px 42px}
.fold:hover{color:var(--p5)}
.rel{margin-left:42px;background:var(--g1);border-radius:4px;padding:4px 12px}
.rel .msg{padding:6px 0}
.tag{font-size:11px;color:var(--g7);background:var(--g3);border-radius:3px;padding:0 5px;line-height:16px}
/* composer */
.comp{flex:none;padding:6px 24px 12px;background:#fff}
.comp .box{border:1px solid var(--g5);border-radius:6px;background:#fff;padding:8px 10px}
.comp .box:focus-within{border-color:var(--p5);box-shadow:0 1px 0 0 var(--p5)}
.comp .to{display:flex;gap:16px;align-items:center;font-size:12px;color:var(--g7);margin-bottom:6px;flex-wrap:wrap}
.comp .to b{color:var(--g8);font-weight:600}
.comp .to select{height:24px;font-size:12px;border:1px solid var(--g4);border-radius:4px;background:#fff}
.comp .to .lock{background:var(--g3);border-radius:4px;padding:1px 6px;color:var(--g8);font-weight:600}
.comp textarea{width:100%;border:0;resize:none;outline:none;font-size:14px;line-height:1.5;height:40px;padding:0}
.comp .cf{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rrow{display:flex;gap:8px;align-items:flex-end}
.rrow textarea{flex:1;height:32px!important}
.comp .cf .chips{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.comp .cf{flex-wrap:nowrap!important}
.wb-mid .hint,.wb-narrow .hint,.narrowA .hint{display:none}
.body{position:relative}
.list.mid{width:240px}
.list.full{width:100%;flex:1}
.wb-narrow .tl,.wb-narrow .dhead,.wb-narrow .comp,.wb-narrow .shead{padding-left:16px;padding-right:16px}
.tlwrap{flex:1;position:relative;min-height:0;display:flex;flex-direction:column}
.jump{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);border:1px solid var(--wa1);background:var(--wa0);color:var(--wa3);font-size:12px;font-weight:600;border-radius:4px;padding:4px 12px;box-shadow:0 2px 8px rgba(0,0,0,.12);white-space:nowrap;display:none}
.jump.show{display:block}
.qbg{font-size:12px;color:var(--g8);background:#fff;border-radius:4px;padding:6px 10px;margin-bottom:10px}
.warnin{color:var(--wa3);font-weight:600}
.drawer{position:absolute;top:0;right:0;bottom:0;width:300px;background:var(--g1);box-shadow:-4px 0 16px rgba(0,0,0,.14);display:flex;flex-direction:column;z-index:5}
.drawer.full{width:100%;box-shadow:none}
.drawer .dh{display:flex;align-items:center;padding:10px 12px 0;font-size:13px;font-weight:600}
.drawer .dh button{margin-left:auto}
.shead{flex-wrap:wrap}
.shead .lb{margin-left:auto;flex:none}
.gsel{height:26px;font-size:13px;border:1px solid var(--g4);border-radius:4px;background:#fff;font-weight:600}
.ub{font-size:11px;color:var(--g7);background:var(--g3);border-radius:3px;padding:0 4px;margin-left:auto;font-weight:400}
.comp .cf .hint{white-space:nowrap;font-size:12px;color:var(--g7);margin-left:auto;margin-right:8px}
.qc{border:1px solid var(--g4);background:var(--g1);border-radius:4px;font-size:12px;padding:2px 8px;color:var(--g8)}
.qc:hover{border-color:var(--g6);background:#fff}
.err{color:var(--er3);font-size:12px;font-weight:600}
/* new compose page */
.newpage{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:0 24px 8px}
.newpage .intro{max-width:560px;margin:0 auto auto;padding-top:48px}
.newpage h2{font-size:16px;margin:0 0 6px;font-weight:600}
.newpage p{margin:0 0 4px;color:var(--g8);font-size:13px}
.newpage ul{margin:6px 0 0;padding-left:18px;color:var(--g8);font-size:13px}
/* B stream */
.groups{width:200px;flex:none;background:var(--g1);padding:12px 8px;border-right:1px solid var(--g4);overflow:auto}
.groups h3{font-size:12px;color:var(--g7);font-weight:600;margin:0 8px 6px}
.gi{display:flex;width:100%;border:0;background:transparent;border-radius:4px;padding:6px 10px;font-size:13px;text-align:left;align-items:center;gap:6px;position:relative;color:var(--g9)}
.gi:hover{background:var(--g3)}
.gi.on{background:var(--p0);font-weight:600}
.gi.on::before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:3px;border-radius:2px;background:var(--p5)}
.gi .n{margin-left:auto;font-size:11px;font-weight:600;background:var(--wa0);color:var(--wa3);border-radius:4px;padding:0 5px}
.stream{flex:1;display:flex;flex-direction:column;min-width:0;background:#fff}
.shead{padding:12px 24px 8px;flex:none;display:flex;align-items:baseline;gap:10px}
.shead h1{font-size:16px;margin:0;font-weight:600}
.shead span{font-size:12px;color:var(--g7)}
.glabel{font-size:11px;color:var(--g7);padding:10px 0 0 42px}
.tchip{display:flex;align-items:center;gap:8px;margin-top:6px;max-width:520px;border-radius:4px;background:var(--g2);padding:6px 10px;border:0;border-left:3px solid var(--p5);text-align:left;width:100%;font-size:13px;color:var(--g9)}
.tchip:hover{background:var(--g3)}
.tchip .id{font-weight:600;flex:none}
.tchip .x{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;color:var(--g8)}
.tchip .go{color:var(--p5);font-size:12px;flex:none}
.flash{animation:fl 1.6s ease-out}
@keyframes fl{0%{background:var(--p1)}100%{background:inherit}}
/* modal */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;z-index:9}
.modal{background:#fff;border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);width:400px;padding:20px 24px}
.modal h3{margin:0 0 8px;font-size:16px}
.modal p{margin:0 0 16px;font-size:13px;color:var(--g8)}
.modal .f{display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--g9);color:#fff;font-size:13px;padding:8px 14px;border-radius:4px;z-index:10}
</style>
</head>
<body>
<div id="app" style="display:contents"></div>
<script>
const GROUPS=[{id:'g1',name:'AE比对测试群',bound:1},{id:'g2',name:'CM编程群',bound:1},{id:'g3',name:'项目B交付群',bound:0},{id:'dm',name:'私聊（我和幕僚长任务）',dm:1}];
const TAB_GROUP='g1';
const QUICK=['用R比对AE','只生成AE程序','重新生成AE','比对 AE 和 CM'];
const BOT='幕僚长任务';
const AVC={'我':'','同事A':'c1','同事B':'c2','同事C':'c3'};
function gname(id){return (GROUPS.find(g=>g.id===id)||{}).name||''}
let NEXT=45;
const TASKS=[
 {id:42,g:'g2',by:'同事B',date:'10-10',time:'12:40',status:'New',stage:'等待受理',summary:'刚记录，还没受理',raw:'只生成AE程序，先不跑比对。',canSwap:1,

  if(ans){
    return `<div class="card q done"><div class="ch">问题卡 · 第 ${t.q.round} 轮 <span class="bd c-pass">✓ 已收到</span><span class="sub">${ans.who} ${ans.time} 在面板答的，群里那张卡也已显示「已收到」</span></div>
     ${t.q.bg?`<div class="qbg">${esc(t.q.bg)}</div>`:''}${t.q.items.map((q,i)=>{const o=q.o.find(x=>x[0]===ans.p[i]);return `<div class="qi"><div class="qt">${i+1}. ${esc(q.t)}</div><button class="opt on" disabled><span class="dot"></span><span class="ltr">${o[0]}</span>${esc(o[1])}</button></div>`}).join('')}</div>`;
  }
  return `<div class="card q"><div class="ch">问题卡 · 第 ${t.q.round} 轮 · ${t.q.items.length} 个问题<span class="sub">群里是同一张卡，谁先答算谁</span></div>
   ${t.q.bg?`<div class="qbg">${esc(t.q.bg)}</div>`:''}${t.q.items.map((q,i)=>`<div class="qi"><div class="qt">${i+1}. ${esc(q.t)}</div>${q.o.map(o=>`<button class="opt ${picks[i]===o[0]?'on':''}" data-act="pick" data-t="${t.id}" data-i="${i}" data-x="${o[0]}"><span class="dot"></span><span class="ltr">${o[0]}</span>${esc(o[1])}</button>`).join('')}</div>`).join('')}
   <div class="qf"><button class="btn pri" data-act="answer" data-t="${t.id}" ${all?'':'disabled'}>提交回答</button><span>${all?'将提交：'+t.q.items.map((_,i)=>(i+1)+picks[i]).join(' '):'每题选一个'}</span></div></div>`;
}

/* ---------- composer ---------- */
function composer(mode,t,demote){
  const tab=isTab();
  let to='';
  if(mode==='reply'){
    to=`<span>追问 <b>TASK-${t.id}</b>，记到本串</span>`;
  }else{
    let gsel;
    if(tab)gsel=`<span class="lock">${gname(TAB_GROUP)}</span><span>已锁定，只发本群</span>`;
    else if(S.v==='B'&&S.bGroup!=='all')gsel=`<span class="lock">${gname(S.bGroup)}</span>`;
    else gsel=`<select data-ch="draftG"><option value="">请选择群</option>${GROUPS.filter(g=>!g.dm).map(g=>`<option value="${g.id}" ${S.draftG===g.id?'selected':''}>${g.name}${g.bound?'':'（未绑定）'}</option>`).join('')}</select>`;
    const tg=tab?TAB_GROUP:(S.v==='B'&&S.bGroup!=='all'?S.bGroup:S.draftG);
    to=`<span><b>发到</b> ${gsel}</span><span><b>交给</b> ${BOT}</span>${S.err?`<span class="err">${S.err}</span>`:''}${tg&&!bound(tg)?`<span class="warnin">这个群还没绑定项目，发出会记成 TASK-n，但暂时不会有受理回执</span>`:''}`;
  }
  const ph=mode==='reply'?`追问 TASK-${t.id}…`:'跟幕僚长任务说要做什么，比如「用R比对AE，Spec 用 v1.2」';
  const canSend=S.draft.trim().length>0;
  if(mode==='reply')return `<div class="comp"><div class="box"><div class="to">${to}</div><div class="rrow"><textarea data-in="draft" placeholder="${ph}">${esc(S.draft)}</textarea><button class="btn ${demote?'':'pri'}" data-act="send" data-m="reply" ${canSend?'':'disabled'}>发送</button></div></div></div>`;
  return `<div class="comp"><div class="box"><div class="to">${to}</div>
   <textarea data-in="draft" placeholder="${ph}">${esc(S.draft)}</textarea>
   <div class="cf"><div class="chips">${mode==='new'?QUICK.map(q=>`<button class="qc" data-act="quick" data-x="${q}">${q}</button>`).join(''):''}</div><span class="hint">Enter 发送 · Shift+Enter 换行</span>
   <button class="btn ${demote?'':'pri'}" data-act="send" data-m="${mode}" ${canSend?'':'disabled'}>发送</button></div></div></div>`;
}

/* ---------- A ---------- */
function viewA(){
  const wb=S.wb;
  const listCls=wb==='narrow'?'full':wb==='mid'?'mid':(isTab()?'narrow':'');
  const list=`<div class="list ${listCls}">${filterBar()}${listItems(S.compose?null:S.sel)}</div>`;
  let right;
  if(S.compose){
    right=`<section class="detail">${wb==='narrow'?`<div class="dhead" style="padding-bottom:0"><button class="back" data-act="aback">← 返回列表</button></div>`:''}<div class="newpage"><div class="intro"><h2>说一件新事</h2><p>在下面用一句话说要做什么，发出后马上记成一件事（TASK-n），进度、问题、结果都回到这一串里。</p><ul><li>${isTab()?'只发到本群「'+gname(TAB_GROUP)+'」。要发别的群，去左边栏的任务面板。':'先选发到哪个群；群里也会留一条「已记录 TASK-n（来自任务面板）」。'}</li><li>常用说法点一下就填进去，可以再改。</li><li>第一期不填截止时间、不传附件；输入文件按群绑定的项目自动选，受理回执里会写明。</li></ul></div></div>${composer('new')}</section>`;
  }else{
    const t=T(S.sel);
    right=t?threadView(t,{backA:wb==='narrow'}):`<section class="detail"><div class="empty">选一件事查看</div></section>`;
  }
  if(wb==='narrow')return S.aPane==='list'&&!S.compose?list:right;
  return list+right;
}
/* ---------- B ---------- */
function streamEvents(){
  let a=scoped().filter(t=>t.status!=='Non');
  if(!isTab()&&S.bGroup!=='all')a=a.filter(t=>t.g===S.bGroup);
  const ev=[];
  a.forEach(t=>t.tl.forEach((m,i)=>{if(m.grp)ev.push({t,m,key:t.date+' '+m.time+' '+String(i).padStart(2,'0')})}));
  ev.sort((x,y)=>x.key<y.key?-1:x.key>y.key?1:0);
  return ev;
}
function streamItem(e){
  const {t,m}=e;const glab=(!isTab()&&S.bGroup==='all')?`<div class="glabel">${esc(t.g==='dm'?'私聊':gname(t.g))}</div>`:'';
  if(m.k==='logged')return `<div class="sysl ${m.hl?'hl':''}">${esc(m.text)}<span class="t">${m.time}</span></div>`;
  if(m.k==='sys'||m.k==='stage')return `<div class="sysl">${esc(m.text)}<span class="t">${m.time}</span></div>`;
  const chip=`<button class="tchip" data-act="bopen" data-x="${t.id}"><span class="id">TASK-${t.id}</span><span class="x">${esc(sum80(t.raw))}</span>${badge(t.status)}${waitB(t)}<span class="go">打开串 ›</span></button>`;
  const flash=S.flash===t.id&&m.k==='me'?'flash':'';
  if(m.k==='me')return glab+`<div class="msg ${flash}">${avatar(m.who)}<div class="mb"><div class="mh"><b>${m.who}</b><span>${e.t.date==='10-10'?'今天':e.t.date} ${m.time}</span></div><div class="mt">${esc(m.text)}</div>${chip}</div></div>`;
  const kind={ack:'受理回执',q:'问题卡',res:'结果',fail:'异常',bot:'回复'}[m.k]||'';
  let inner='';
  if(m.k==='ack'||m.k==='bot')inner=`<div class="mt">${esc(m.text)}</div>`;
  if(m.k==='q')inner=qCard(t);
  if(m.k==='res')inner=`<div class="mt">结果：<span class="bd ${t.res.cls}">${t.res.c}</span> ${esc(t.res.d)}</div><div class="mt" style="font-size:12px;color:var(--g7);word-break:break-all">写回 <span class="mono">${esc(t.res.path)}</span> · ${esc(t.res.hash)} · 任务显示完成，不等于真实数据已核对</div>`;
  if(m.k==='fail')inner=`<div class="mt">没跑成：${esc(t.fail.why)}</div>`;
  return glab+`<div class="msg">${avatar(BOT)}<div class="mb"><div class="mh"><b>${BOT}</b><span>${e.t.date==='10-10'?'今天':e.t.date} ${m.time}</span><span class="k">${kind}</span></div>${inner}${chip}</div></div>`;
}
function groupLabel(g){return g.dm?'私聊':g.name}
function viewB(){
  const tab=isTab();const wb=S.wb;const wide=wb==='wide';
  let groups='';
  const cnt=g=>TASKS.filter(t=>(g==='all'||t.g===g)&&t.wait&&!S.answered[t.id]).length;
  if(!tab&&wide&&S.gcol){
    groups=`<aside class="groups"><h3>群</h3>${[{id:'all',name:'全部群',bound:1}].concat(GROUPS).map(g=>{const n=cnt(g.id);return `<button class="gi ${S.bGroup===g.id?'on':''}" data-act="bgroup" data-x="${g.id}">${esc(groupLabel(g))}${n?`<span class="n">${n} 待答</span>`:(g.bound||g.dm?'':'<span class="ub">未绑定</span>')}</button>`}).join('')}</aside>`;
  }
  const nList=filtered().length;
  let center;
  if(S.bThread){center=threadView(T(S.bThread),{back:1})}
  else{
    const ev=streamEvents();
    let title;
    if(tab)title=`<h1>本群任务动态</h1>`;
    else if(wide&&S.gcol)title=`<h1>${esc(S.bGroup==='all'?'全部群的任务动态':gname(S.bGroup))}</h1>`;
    else title=`<select class="gsel" data-ch="bGroup" aria-label="群">${[{id:'all',name:'全部群'}].concat(GROUPS).map(g=>`<option value="${g.id}" ${S.bGroup===g.id?'selected':''}>${esc(groupLabel(g))}${g.id!=='all'&&!g.dm&&!g.bound?'（未绑定）':''}</option>`).join('')}</select>`;
    center=`<section class="stream"><div class="shead">${title}${wide?`<span>只显示和任务有关的消息：发起、受理回执、问题卡、结果/异常。闲聊留在群聊里。</span>`:`<button class="btn lb" data-act="blist">任务列表 ${nList} ›</button>`}</div>
     <div class="tlwrap"><div class="tl">${ev.length?ev.map(streamItem).join(''):`<div class="empty"><b>这里还没有任务</b>在下方说一件事，发出就记成 TASK-n。</div>`}</div><button class="jump" data-act="jump">↓ 下面有问题卡等你回答</button></div>${composer('new',null,ev.some(e=>e.m.k==='q'&&!S.answered[e.t.id]))}</section>`;
  }
  const listInner=`${filterBar(1)}${listItems(S.bThread)}`;
  let right='';
  if(wide)right=`<div class="list right ${tab?'narrow':''}"><div style="padding:12px 12px 0;font-size:13px;font-weight:600">${tab?'本群任务':'任务列表'}</div>${listInner}</div>`;
  else if(S.bList)right=`<div class="drawer ${wb==='narrow'?'full':''}"><div class="dh">${tab?'本群任务':'任务列表'}<button class="tbtn" data-act="blist">关闭</button></div>${listInner}</div>`;
  return `${groups}${center}${right}`;
}
/* ---------- modal ---------- */
function modal(){
  const m=S.modal;
  if(m.k==='cancel')return `<div class="mask"><div class="modal"><h3>取消 TASK-${m.id}？</h3><p>群里任何人都可以取消。取消后这件事停在当前阶段，群里会收到一条取消记录，不能恢复。</p><div class="f"><button class="btn" data-act="mclose">不取消</button><button class="btn danger" data-act="mcancel">确认取消</button></div></div></div>`;
  if(m.k==='swap')return `<div class="mask"><div class="modal"><h3>换输入文件（TASK-${m.id}）</h3><p>只在开跑前能换。原型里不做文件选择；真实版会列出本群项目下可用的 7z / Spec，选好后重新出受理回执。</p><div class="f"><button class="btn pri" data-act="mclose">知道了</button></div></div></div>`;
}
/* ---------- actions ---------- */
function now(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function toast(s){S.toast=s;render();setTimeout(()=>{S.toast='';render()},1800)}
function sendNew(){
  const text=S.draft.trim();if(!text)return;
  let g=isTab()?TAB_GROUP:(S.v==='B'&&S.bGroup!=='all'?S.bGroup:S.draftG);
  if(!g){S.err='先选发到哪个群';render();return}
  const id=NEXT++;const tm=now();
  const t={id,g,by:'我',date:'10-10',time:tm,status:'New',stage:'等待受理',summary:'刚记录，还没受理',raw:text,canSwap:1,
    tl:[{k:'me',who:'我',time:tm,text,grp:1},{k:'logged',time:tm,text:`已记录 TASK-${id}（来自任务面板）· 群「${gname(g)}」里也留了一条`,hl:1,grp:1}]};
  TASKS.unshift(t);S.draft='';S.err='';S.draftG='';S.compose=false;S.flash=id;
  if(S.v==='A'){S.sel=id;S.aPane='thread'}
  if(!bound(g)){t.stage='等待绑定项目';t.summary='这个群还没绑定项目，暂时不会有回执';t.canSwap=0;t.tl.push({k:'sys',time:tm,text:'这个群还没绑定项目，暂时不会有受理回执。',grp:1});S.scrollEnd=true;render();return}
  S.scrollEnd=true;render();
  setTimeout(()=>{t.status='InProgress';t.stage='准备输入文件';t.summary='已受理，输入文件已选好';t.tl.push({k:'ack',time:now(),text:`已受理。用的是群「${gname(g)}」绑定项目的最新数据包和 Spec v1.2。不对可以在开跑前换文件。`,grp:1});S.flash=null;S.scrollEnd=true;render()},1500);
}
function sendReply(){
  const t=T(S.v==='A'?S.sel:S.bThread);const text=S.draft.trim();if(!t||!text)return;
  t.tl.push({k:'me',who:'我',time:now(),text,tag:'追问'});S.draft='';S.scrollEnd=true;render();
  setTimeout(()=>{t.tl.push({k:'bot',kind:'回复',time:now(),text:`收到追问，已记到 TASK-${t.id}，有结论回到本串。`});S.scrollEnd=true;render()},900);
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,x=b.dataset.x;
  if(a==='v'){S.v=x;S.compose=false;S.bThread=null;S.bList=false;S.draft='';S.err='';if(x==='B')S.scrollEnd=true;else S.scrollTop0=true}
  else if(a==='e'){S.e=x;S.compose=false;S.bThread=null;S.bList=false;S.draft='';S.err='';S.f.g='all';S.bGroup='all';if(x==='tab'&&T(S.sel).g!==TAB_GROUP)S.sel=41;if(S.v==='B')S.scrollEnd=true;else S.scrollTop0=true}
  else if(a==='sel'){S.scrollTop0=true;if(S.v==='A'){S.sel=+x;S.compose=false;S.aPane='thread'}else{S.bThread=+x;S.bList=false}S.draft=''}
  else if(a==='new'){S.compose=true;S.aPane='thread';S.draft='';S.focus=true}
  else if(a==='aback'){S.aPane='list';S.compose=false}
  else if(a==='blist'){S.bList=!S.bList}
  else if(a==='jump'){const c=document.querySelector('.tl .card.q:not(.done)');if(c)c.scrollIntoView({block:'end'});updPill();return}
  else if(a==='who')S.f.who=x;
  else if(a==='wait')S.f.wait=!S.f.wait;
  else if(a==='clear')S.f={g:'all',who:'all',st:'all',date:'all',wait:false,non:false,q:''};
  else if(a==='pick'){const t=b.dataset.t;S.picks[t]=S.picks[t]||{};S.picks[t][b.dataset.i]=x}
  else if(a==='answer'){const id=+b.dataset.t;const t=T(id);const p=t.q.items.map((_,i)=>S.picks[id][i]);const tm=now();S.answered[id]={who:'我',time:tm,p};t.wait=false;t.stage='比对 AE';t.summary='已收到回答，按 Spec v1.2、原样比对开跑';
    t.tl.push({k:'sys',time:tm,text:'已收到回答 '+p.map((v,i)=>(i+1)+v).join(' ')+' · 群里的问题卡同步显示「已收到」'});t.tl.push({k:'stage',time:tm,text:'阶段：比对 AE'});S.scrollEnd=true}
  else if(a==='quick'){S.draft=S.draft.trim()?S.draft.trim()+'，'+x:x;S.focus=true}
  else if(a==='send'){b.dataset.m==='new'?sendNew():sendReply();return}
  else if(a==='rel')S.openRel[x]=!S.openRel[x];
  else if(a==='cancel')S.modal={k:'cancel',id:S.v==='A'?S.sel:S.bThread};
  else if(a==='swap')S.modal={k:'swap',id:S.v==='A'?S.sel:S.bThread};
  else if(a==='mclose')S.modal=null;
  else if(a==='mcancel'){const t=T(S.modal.id);t.status='Cancelled';t.stage='已取消';t.summary='我 '+now()+' 取消';t.wait=false;t.canSwap=0;t.tl.push({k:'sys',time:now(),text:'我取消了这件事 · 群里已留记录'});S.modal=null}
  else if(a==='bgroup'){S.bGroup=x;S.bThread=null;S.scrollEnd=true}
  else if(a==='bopen'){S.bThread=+x;S.scrollTop0=true}
  else if(a==='bback'){S.bThread=null;S.scrollEnd=true}
  render();
});
document.addEventListener('input',e=>{
  const k=e.target.dataset.in;if(!k)return;
  if(k==='draft'){S.draft=e.target.value;const btn=document.querySelector('[data-act=send]');if(btn)btn.disabled=!S.draft.trim();if(S.err){S.err=''}}
  if(k==='q'){S.f.q=e.target.value;const pos=e.target.selectionStart;render();const i=document.querySelector('[data-in=q]');i.focus();i.setSelectionRange(pos,pos)}
});
document.addEventListener('change',e=>{
  const k=e.target.dataset.ch;if(!k)return;
  if(k==='non')S.f.non=e.target.checked;else if(k==='bGroup'){S.bGroup=e.target.value;S.scrollEnd=true}else if(k==='draftG'){S.draftG=e.target.value;S.err=''}else S.f[k]=e.target.value;
  render();
});
document.addEventListener('keydown',e=>{
  if(e.target.dataset&&e.target.dataset.in==='draft'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();const m=document.querySelector('[data-act=send]');if(m)m.dataset.m==='new'?sendNew():sendReply()}
});
(function(){const h=new URLSearchParams(location.hash.slice(1));if(h.get('v'))S.v=h.get('v');if(h.get('e'))S.e=h.get('e');if(h.get('sel'))S.sel=+h.get('sel');if(S.v==='B')S.scrollEnd=true;else S.scrollTop0=true})();
render();
</script>
</body>
</html>
